<!-- Full Width Banner -->
<div class="banner">
  <div class="banner-content">
    <div class="banner-text">
      <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="8" width="18" height="4" rx="1"/>
        <path d="m12 8-2-2v2"/>
        <path d="m12 8 2-2v2"/>
        <path d="M12 8v13"/>
        <path d="M7 16h10"/>
      </svg>
      <h2>Gift Request Form</h2>
    </div>
  </div>
</div>

<div class="container">
  <form [formGroup]="giftRequestForm" (ngSubmit)="onSubmit()" class="form-container">
    
    <!-- Personal Information Section -->
    <div class="card">
      <div class="card-header">
        <h3>Requester's Details</h3>
      </div>
      <div class="card-content">
        <div class="grid-container">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input 
              id="email" 
              type="email" 
              formControlName="email"
              placeholder="your.email@example.com"
              class="form-input"
              readonly
              required>
          </div>
          
          <div class="input-group">
            <label for="location">Location</label>
            <input 
              id="location" 
              formControlName="location"
              placeholder="Enter your location..."
              class="form-input"
              required>
          </div>
          
          <div class="input-group">
            <label for="function">Function</label>
            <input 
              id="function" 
              formControlName="function"
              placeholder="Enter your function..."
              class="form-input"
              required>
          </div>
        </div>
      </div>
    </div>

    <!-- Request Details Section -->
    <div class="card">
      <div class="card-header">
        <h3>Request Details</h3>
      </div>
      <div class="card-content">
        <div class="grid-container">
          
          <div class="input-group">
            <label for="sourceStoreId">Source Store</label>
            <select 
                  id="sourceStoreId"
                  formControlName="sourceStoreId"
                  class="form-select"
                  required>
                  <option value="">Select a store</option>
                  <option *ngFor="let store of allGhetStores" [value]="store.id">
                    {{store.name}}
                  </option>
                </select>

          </div>
          
          <div class="input-group">
            <label for="department">Department</label>
            <input 
              id="department" 
              formControlName="department"
              placeholder="Input store department..."
              class="form-input"
              readonly
              required>
          </div>

          <div class="input-group">
                <label for="ghet">GHET</label>
                <select 
                    id="ghet"
                    formControlName="ghet"
                    class="form-select"
                    required>
                    <option value="">Select an option...</option>
                    <option *ngFor="let ghet of allGhetOptions" [value]="ghet.option"> 
                    {{ ghet.option }} 
                    </option>
                </select>
            </div>

        </div>


        <div class="input-group">
            <label for="sourceStoreId">HoD To Approve</label>
            <select 
                  id="hodToApprove"
                  formControlName="hodToApprove"
                  class="form-select"
                  required>
                  <option value="">Select the HoD...</option>
                  <option *ngFor="let hod of allHoDs" [value]="hod.email">
                    {{hod.firstName}} {{hod.lastName}} - {{hod.email}}
                  </option>
                </select>

        </div>


        <div class="input-group">
            <label for="description">Description</label>
            <textarea 
              id="description"  
              type="description" 
              formControlName="description"
              placeholder="Input a brief description..."
              class="form-input"
              required>
            </textarea>
        </div>

        <div class="input-group">
            <label for="justification">Justification</label>
            <textarea 
              id="justification"  
              type="justification" 
              formControlName="justification"
              placeholder="Input the justification..."
              class="form-input"
              required>
            </textarea>
        </div>

      </div>
    </div>

    <!-- Gift Items Section -->
    <div class="card">
      <div class="card-header">
        <h3>Gift Items</h3>
      </div>
      <div class="card-content">
        <div formArrayName="gifts">
          <div *ngFor="let gift of giftsArray.controls; let i = index" 
               [formGroupName]="i" 
               class="gift-item">
            
            <div class="gift-item-header">
              <h3>Gift Item {{i + 1}}</h3>
              <button 
                *ngIf="giftsArray.length > 1"
                type="button" 
                class="remove-btn"
                (click)="removeGiftItem(i)">
                <svg class="trash-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="m3 6 3 0"/>
                  <path d="m19 6-3 0"/>
                  <path d="m8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  <path d="m10 11 0 6"/>
                  <path d="m14 11 0 6"/>
                  <path d="M5 6l1 14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2L19 6"/>
                </svg>
                Remove
              </button>
            </div>

            <div class="gift-item-grid">

              <div class="input-group">
                <label [for]="'itemId' + i">Item</label>
                <select 
                    [id]="'itemId-' + i"
                    formControlName="itemId"
                    class="form-select"
                    required
                >
                    <option value="">Select an item</option>

                    <ng-container *ngIf="storeInvMovts && storeInvMovts.length > 0; else noItems">
                    <option *ngFor="let item of storeInvMovts" [value]="item.id">
                        {{ item.itemName }} (In stock: {{ item.quantity }})
                    </option>
                    </ng-container>

                    <ng-template #noItems>
                    <option disabled>No item in this store yet</option>
                    </ng-template>
                </select>
                </div>

                
              <div class="input-group">
                <label [for]="'quantity-' + i">Quantity</label>
                <input 
                  [id]="'quantity-' + i"
                  formControlName="quantity"
                  placeholder="Input quantity..."
                  class="form-input"
                  required>
              </div>

              
            </div>

          </div>
        </div>

        <div class="add-gift-container">
          <button 
            type="button"
            (click)="addGiftItem()"
            class="add-gift-btn">
            <svg class="plus-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="m12 8v8"/>
              <path d="m8 12h8"/>
            </svg>
            Add More Gift Item
          </button>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button 
        type="submit"
        class="submit-btn">
        Submit Request
      </button>
      <button 
        type="button"
        (click)="resetForm()"
        class="reset-btn">
        Reset Form
      </button>
    </div>
  </form>
</div>
