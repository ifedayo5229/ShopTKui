<mat-card class="w-100">
    <mat-card-content>
      <h2 class="mb-56">All Items (IT)</h2>
  
      <div class="table-responsive">
            
        <mat-form-field>
            <mat-label>Search items</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Search" #input>
        </mat-form-field>   
        <table  mat-table [dataSource]="dataSource" matSort class="text-nowrap w-100">
  
            <!-- Id Column -->
            <ng-container matColumnDef="position">
                <th mat-header-cell *matHeaderCellDef fxHide.lt-sm fxHide.lt-md fxHide.md>S/N </th>
                <td mat-cell class="fw-medium" *matCellDef="let i = index" fxHide.lt-sm fxHide.lt-md fxHide.md> 
                  {{ (paginator.pageIndex * paginator.pageSize) + (i + 1) }}
                </td>
            </ng-container>

            <!-- Reference Column -->
            <ng-container matColumnDef="reference">
              <th mat-header-cell *matHeaderCellDef> Item Code </th>
              <td mat-cell *matCellDef="let req">
                  <p class="mb-0 fw-medium">{{req.code}}</p>
              </td>
            </ng-container>
  
            <!-- Item name Column -->
            <ng-container matColumnDef="itemName">
                <th mat-header-cell *matHeaderCellDef> Name </th>
                <td mat-cell *matCellDef="let item">
                    <p class="mb-0 fw-medium">{{item.itemName}}</p>
                </td>
            </ng-container>
                
            <!-- Description Column -->
            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef fxHide.lt-sm fxHide.lt-md fxHide.md> Description </th>
                <td mat-cell *matCellDef="let item" fxHide.lt-sm fxHide.lt-md fxHide.md>
                    <p class="mb-0 fw-medium">{{item.description}}</p>
                </td>
            </ng-container>
  
            <!-- Categgory Column -->
            <ng-container matColumnDef="categoryName">
              <th mat-header-cell *matHeaderCellDef>Category</th>
              <td mat-cell *matCellDef="let item">
                  <p class="mb-0 fw-medium">{{item.categoryName}}</p>
              </td>
          </ng-container>
  
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <!-- mat-paginator -->
        <mat-paginator #paginator [pageSizeOptions]="[5, 10, 15, 20]" showFirstLastButtons></mat-paginator>
      </div>
    </mat-card-content>
</mat-card>
