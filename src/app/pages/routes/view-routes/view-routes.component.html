<mat-card class="w-100">
    <mat-card-content>
      <h2 class="mb-56">View Route</h2>
  
      <div class="table-responsive">
            
        <mat-form-field>
            <mat-label>Search Routes</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Search" #input>
        </mat-form-field>   
        <table  mat-table [dataSource]="dataSource" matSort class="text-nowrap w-100">
  
            <!-- Id Column -->
            <ng-container matColumnDef="position">
                <th mat-header-cell *matHeaderCellDef fxHide.lt-sm fxHide.lt-md fxHide.md fxHide>Position </th>
                <td mat-cell class="fw-medium" *matCellDef="let i = index" fxHide.lt-sm fxHide.lt-md fxHide.md fxHide> {{i+1}} </td>
            </ng-container>
  
            <!-- Referred Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Name </th>
                <td mat-cell *matCellDef="let user">
                    <p class="mb-0 fw-medium">{{user.lastName}} {{user.firstName}}</p>
                </td>
            </ng-container>
                
            <!-- Quantity Column -->
            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef fxHide.lt-sm fxHide.lt-md fxHide.md> Email Address </th>
                <td mat-cell *matCellDef="let user" fxHide.lt-sm fxHide.lt-md fxHide.md>
                    <p class="mb-0 fw-medium">{{user.email}}</p>
                </td>
            </ng-container>
  
            <ng-container matColumnDef="positions">
              <th mat-header-cell *matHeaderCellDef fxHide.lt-sm fxHide.lt-md fxHide.md>Position</th>
              <td mat-cell *matCellDef="let user" fxHide.lt-sm fxHide.lt-md fxHide.md>
                  <p class="mb-0 fw-medium">{{user.position}}</p>
              </td>
          </ng-container>
  
          <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef fxHide.lt-sm fxHide.lt-md fxHide.md>Action</th>
            <td mat-cell *matCellDef="let user">
              <button mat-raised-button color="primary" (click)="viewUser(user)">View</button>
            </td>
          </ng-container>
  
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <!-- mat-paginator -->
        <mat-paginator #paginator [pageSizeOptions]="[5, 10, 15, 20]" showFirstLastButtons></mat-paginator>
      </div>
    </mat-card-content>
</mat-card>
