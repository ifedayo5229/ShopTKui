<mat-card-content>
    <div class="objective-popup">
      <h2 class="objective-header">Reject IT Request</h2>
      <form [formGroup]="approveRequestForm" class="objective-form-container">
        <div class="objective-form-content">
          
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Quantity</mat-label>
            <input matInput type="number" formControlName="quantity" placeholder="Enter quantity" readonly>
            <mat-error class="error" *ngIf="approveRequestForm.get('quantity')?.errors?.['required']">
              Quantity is required.
            </mat-error>
            <mat-error class="error" *ngIf="approveRequestForm.get('quantity')?.errors?.['invalidQuantity']">
              Please enter a valid quantity
            </mat-error>
            <mat-error class="error" *ngIf="approveRequestForm.get('quantity')?.errors?.['zeroQuantity']">
              Quantity cannot be zero
            </mat-error>
          </mat-form-field>
          
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>COMMENT</mat-label>
            <textarea matInput formControlName="comment" rows="4" placeholder="Please input your comment"></textarea>
            <mat-error class="error" *ngIf="approveRequestForm.get('comment')?.errors?.['required']">
              Comment is required.
            </mat-error>
          </mat-form-field>

        </div>
        <div class="action-buttons">
          <button mat-raised-button class="submit-button" color="primary" (click)="rejectRequest()" [disabled]="isSubmitting">Reject</button>
          <button mat-raised-button color="warn" class="cancel-button" (click)="onCancelClick()">Cancel</button>
        </div>
      </form>
    </div>
  </mat-card-content>
