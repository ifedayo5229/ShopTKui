<h1 mat-dialog-title>Confirmation</h1>
<div mat-dialog-content>
  <p>Is this a main store?</p>
</div>
<div mat-dialog-actions>
    <button mat-button (click)="onYesClick()">Yes</button>
    <button mat-button (click)="onNoClick()">No</button>
</div>
